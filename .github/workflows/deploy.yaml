name: Ansible Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy InfluenceSearch
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Install Ansible dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ansible boto3 botocore
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: ansible-galaxy collection install amazon.aws community.docker

      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null && echo "Key is valid"

      - name: Discover EC2 instances
        run: ansible-inventory -i ansible/aws_ec2.yml --graph

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/aws_ec2.yml \
            ansible/playbook.yml \
            --private-key ~/.ssh/ec2_key \
            --user ubuntu \
            --forks 10