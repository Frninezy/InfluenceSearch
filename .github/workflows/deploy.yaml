name: Ansible Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy InfluenceSearch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # Install Ansible
      - name: Install Ansible dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ansible boto3 botocore
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Install AWS collection
      - name: Install AWS collection
        run: |
          ansible-galaxy collection install amazon.aws

      # Configure SSH private key
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      # Discover EC2 instances
      - name: Discover EC2 instances
        run: |
          ansible-inventory \
            -i ansible/aws_ec2.yml \
            --graph

      # Configure SSH host key verification
      - name: Configure SSH known hosts
        run: |
          ssh-keyscan -H 18.153.90.144 63.176.147.196 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Deploy application
      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/aws_ec2.yml \
            ansible/playbook.yml \
            --private-key ~/.ssh/ec2_key \
            --user ubuntu \
            --forks 10