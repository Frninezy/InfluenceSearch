
name: Test Docker Compose and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build containers
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Test HTTP response
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost/; then
              echo "Application is responding!"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to respond"
          exit 1

      - name: Show logs if a step fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Install Docker if it is missing
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc

              . /etc/os-release

              echo "Types: deb
URIs: https://download.docker.com/linux/ubuntu
Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
Components: stable
Architectures: $(dpkg --print-architecture)
Signed-By: /etc/apt/keyrings/docker.asc" \
                | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null

              sudo apt-get update
              sudo apt-get install -y \
                docker-ce \
                docker-ce-cli \
                containerd.io \
                docker-buildx-plugin \
                docker-compose-plugin
            fi

            # Start Docker
            sudo systemctl enable --now docker

            # Clone the repository on the first deployment
            if [ ! -d "$HOME/InfluenceSearch/.git" ]; then
              git clone \
                https://github.com/${{ github.repository }}.git \
                "$HOME/InfluenceSearch"
            fi

            # Update the repository
            cd "$HOME/InfluenceSearch"
            git fetch origin main
            git reset --hard origin/main

            # Build and deploy the application
            sudo docker compose config -q
            sudo docker compose up -d --build --remove-orphans

            # Show running containers
            sudo docker compose ps
