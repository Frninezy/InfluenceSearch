name: Test Docker Compose and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-instances:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      running_count: ${{ steps.count.outputs.running_count }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Count running instances
        id: count
        run: |
          COUNT=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" \
                      "Name=tag:Project,Values=InfluenceSearch" \
            --query 'length(Reservations[].Instances[])' \
            --output text)
          echo "Running instances: $COUNT"
          echo "running_count=$COUNT" >> "$GITHUB_OUTPUT"

  infrastructure:
    needs: check-instances
    if: needs.check-instances.outputs.running_count == '0'
    uses: ./.github/workflows/infastracture.yaml
    secrets: inherit

  test:
    needs: [check-instances, infrastructure]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker --version
          docker compose version
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d
      - name: Test HTTP response
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost/; then
              echo "Application is responding!"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application failed to respond"
          exit 1
      - name: Show logs if a step fails
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit