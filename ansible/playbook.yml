---
- name: Deploy InfluenceSearch on AWS EC2
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    app_directory: /home/ubuntu/InfluenceSearch
    repository: https://github.com/Frninezy/InfluenceSearch.git

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components:
          - stable
        architectures:
          - "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: yes

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Clone or update application
      ansible.builtin.git:
        repo: "{{ repository }}"
        dest: "{{ app_directory }}"
        version: main
        force: yes
      become_user: ubuntu

    - name: Stop existing application containers
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ app_directory }}"
      become_user: ubuntu
      failed_when: false
      changed_when: false

    - name: Deploy application
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_directory }}"
      become_user: ubuntu

    - name: Verify running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_directory }}"
      become_user: ubuntu
      register: compose_status
      changed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        var: compose_status.stdout