---
- name: Deploy InfluenceSearch with Docker
  hosts: aws_ec2
  become: true
  vars:
    repo_url: https://github.com/Frninezy/InfluenceSearch.git
    repo_dest: /opt/InfluenceSearch
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 120

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present
        lock_timeout: 120

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        lock_timeout: 120

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Verify docker compose is installed
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Clone or update the repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        update: true

    - name: Start (or update) the stack
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ repo_dest }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Created' in compose_result.stderr or 'Recreated' in compose_result.stderr"

    - name: Show compose output
      ansible.builtin.debug:
        var: compose_result.stderr_lines