version: '3'

services:
  backend:
    build: ./web
    volumes:
      - ./web:/usr/src/app
    ports:
      - "1900:1900"

  db:
    image: postgres:17
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Influencers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  elasticsearch:
    image: elasticsearch:9.4.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
  
  kibana:
    image: kibana:9.4.3
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

  adminer:
    image: adminer
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  elastic_data: